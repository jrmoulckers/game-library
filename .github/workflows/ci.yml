name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check committed reports for absolute personal paths
        shell: pwsh
        run: |
          $matches = Get-ChildItem reports/baseline -Recurse -File -ErrorAction SilentlyContinue |
            Select-String -Pattern '([A-Za-z]:\\Users\\|/home/[^/]+/|userdata\\[0-9]+|userdata/[0-9]+)'
          if ($matches) {
            $matches | ForEach-Object { Write-Error $_ }
            exit 1
          }

  # ENG-TEST-004 requires each static signal to report independently, so lint is
  # its own job rather than another step in `test`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch Engineering golangci-lint configuration
        env:
          # jrmoulckers/engineering is private, so the default GITHUB_TOKEN cannot
          # read it. Store a token with read access as ENGINEERING_READ_TOKEN.
          GH_TOKEN: ${{ secrets.ENGINEERING_READ_TOKEN }}
        run: scripts/fetch-engineering-config.sh
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
