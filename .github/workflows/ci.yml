name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# External actions are pinned to immutable commit SHAs rather than mutable tags,
# per ENG-SEC-002 (verified supply chain); the trailing comment records the
# human-readable version each SHA corresponded to when it was pinned.
# https://github.com/jrmoulckers/engineering/blob/v0.116.0/principles/assurance/security-and-privacy.md#verified-supply-chain

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Check committed reports for absolute personal paths
        shell: pwsh
        run: |
          $matches = Get-ChildItem reports/baseline -Recurse -File -ErrorAction SilentlyContinue |
            Select-String -Pattern '([A-Za-z]:\\Users\\|/home/[^/]+/|userdata\\[0-9]+|userdata/[0-9]+)'
          if ($matches) {
            $matches | ForEach-Object { Write-Error $_ }
            exit 1
          }

  # ENG-TEST-004 requires each static signal to report independently, so lint is
  # its own job rather than another step in `test`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch Engineering golangci-lint configuration
        run: scripts/fetch-engineering-config.sh
      # Staleness is reported, never enforced: resolving the newest tag at fetch
      # time would let a tag pushed in another repository change this repository's
      # lint rules with no commit here, so the pin stays explicit and this only
      # makes it loud. A network failure is not a staleness signal, so the probe
      # cannot fail the job.
      #
      # The comparison is on `config-revision`, not on the tag. The upstream
      # revision is bumped only when a rule's verdict changes, and in 33 tags
      # that has happened once, so comparing tags means a notice on nearly every
      # release that could not have altered a single lint result. A signal that
      # fires when nothing changed is one contributors learn to skip, which
      # costs exactly the release where it mattered.
      - name: Report an engineering release that changes a lint verdict
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          revision_of() { sed -n 's|^#[[:space:]]*config-revision:[[:space:]]*\([0-9][0-9]*\).*|\1|p' "$1" | head -1; }

          pinned=$(sed -n 's|^# Source: https://github.com/jrmoulckers/engineering/blob/\([^/]*\)/.*|\1|p' .golangci.yml)
          if [ -z "$pinned" ]; then
            echo "::warning::could not read the pinned ref from .golangci.yml; staleness not checked"
            exit 0
          fi

          latest=$(gh api repos/jrmoulckers/engineering/releases/latest --jq .tag_name 2>/dev/null || true)
          if [ -z "$latest" ]; then
            exit 0
          fi
          # releases/latest orders by tag date, not by version, so a patch
          # backported to an older line would report as "latest". Only continue
          # when the reported tag really does sort above the pin, otherwise this
          # would advise a downgrade.
          if [ "$latest" = "$pinned" ] || [ "$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -1)" = "$pinned" ]; then
            exit 0
          fi

          mine=$(revision_of .golangci.yml)
          theirs=$(curl -fsSL --max-time 30 \
            "https://raw.githubusercontent.com/jrmoulckers/engineering/$latest/configs/golangci.yml" \
            2>/dev/null | revision_of /dev/stdin) || theirs=""

          if [ -z "$theirs" ]; then
            exit 0
          elif [ -z "$mine" ]; then
            # A copy predating the marker cannot report that the marker is
            # missing from itself, so absence is the signal: this pin is older
            # than revision tracking and its verdicts cannot be compared.
            echo "::notice::pinned engineering ref $pinned predates config-revision; $latest is revision $theirs, so lint verdicts here cannot be compared"
          elif [ "$mine" != "$theirs" ]; then
            echo "::notice::engineering $latest is config-revision $theirs; this repository is pinned to $pinned at revision $mine, which changes at least one lint verdict"
          fi
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2
          # Name the config explicitly. Without --config, golangci-lint treats a
          # missing file as "no configuration", silently lints with its built-in
          # defaults and reports success, so a fetch that failed to produce a
          # file would look like a clean run.
          args: --config .golangci.yml ./...

  # A citation is the one reference in this repository that no other job can
  # check: a stale tag still returns 200 and a fragment cannot 404 at all, so a
  # citation that has silently stopped meaning what it says is indistinguishable
  # from a correct one without fetching the document. Separate job, per
  # ENG-TEST-004.
  citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check ENG-* citations resolve at the pinned ref
        run: scripts/check-citations.sh --anchors
